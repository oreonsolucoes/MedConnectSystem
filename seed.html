    /* ===== HELPERS ===== */
    async function importar(col, data, label){
      pr(`\n→ Importando ${data.length} ${label}...`);
      let ok=0, err=0;
      for(const item of data){
        try{ await addDoc(collection(db,col), item); ok++; }
        catch(e){ pr(`  ✗ ${e.message}`); err++; }
      }
      pr(`  ✅ ${ok} importados · ❌ ${err} erros`);
      return ok;
    }

    async function limpar(col){
      const snap = await getDocs(collection(db,col));
      for(const d of snap.docs) await deleteDoc(doc(db,col,d.id));
      return snap.size;
    }
